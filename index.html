<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wake Aaron Control Panel</title>

<style>
:root {
  --bg: #0b0f1a;
  --panel: #11182b;
  --green: #00ff9c;
  --red: #ff3b3b;
  --blue: #4db2ff;
  --purple: #b56bff;
  --text: #e8ecf1;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #141c33, var(--bg));
  color: var(--text);
  font-family: "Segoe UI", system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.panel {
  background: linear-gradient(180deg, #141c33, var(--panel));
  border-radius: 20px;
  padding: 40px;
  width: 420px;
  box-shadow: 0 0 40px rgba(0,255,156,0.15);
}

h1 {
  margin: 0 0 10px;
  font-size: 2.3em;
  letter-spacing: 1px;
}

.subtitle {
  opacity: 0.7;
  margin-bottom: 30px;
}

.button {
  position: relative;
  width: 100%;
  padding: 18px;
  margin-bottom: 18px;
  border-radius: 14px;
  border: none;
  font-size: 1.15em;
  font-weight: 600;
  cursor: pointer;
  color: #000;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.button:active {
  transform: scale(0.97);
}

.button.ready {
  background: var(--green);
  box-shadow: 0 0 20px rgba(0,255,156,0.6);
}

.button.blue {
  background: var(--blue);
  box-shadow: 0 0 20px rgba(77,178,255,0.6);
}

.button.red {
  background: var(--red);
  box-shadow: 0 0 25px rgba(255,59,59,0.7);
}

.button.cooldown {
  background: #333;
  color: #aaa;
  box-shadow: none;
  cursor: not-allowed;
}

.cooldown-ring {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  border: 3px solid rgba(255,255,255,0.15);
  animation: ring linear forwards;
}

@keyframes ring {
  from { clip-path: inset(0 0 0 0); }
  to   { clip-path: inset(0 100% 0 0); }
}

.log {
  margin-top: 25px;
  background: #0a1020;
  border-radius: 12px;
  padding: 15px;
  height: 110px;
  overflow-y: auto;
  font-size: 0.9em;
}

.log div {
  margin-bottom: 6px;
  opacity: 0.85;
}

.log span {
  opacity: 0.5;
  font-size: 0.8em;
}
</style>
</head>

<body>
<div class="panel">
  <h1>Wake Aaron</h1>
  <div class="subtitle">Remote notification & override system</div>

  <button id="wakeupBtn" class="button ready">🔔 WAKE AARON UP</button>
  <button id="pingBtn" class="button blue">☕ PING AARON</button>
  <button id="overrideBtn" class="button red">🚨 SILENCE / OVERRIDE</button>

  <div class="log" id="log"></div>
</div>

<script>
const WAKEUP_URL   = "https://maker.ifttt.com/trigger/WAKEUP/with/key/hnISI0zYilbKIora8FUlDhrW3VN2JZM4ibrsaCTYrhe";
const PING_URL     = "https://maker.ifttt.com/trigger/PingAaron/with/key/hnISI0zYilbKIora8FUlDhrW3VN2JZM4ibrsaCTYrhe";
const OVERRIDE_URL = "https://maker.ifttt.com/trigger/EMERGOVR/with/key/hnISI0zYilbKIora8FUlDhrW3VN2JZM4ibrsaCTYrhe";

const cooldownSeconds = 5;
const log = document.getElementById("log");

function logMsg(msg) {
  const line = document.createElement("div");
  const time = new Date().toLocaleTimeString();
  line.innerHTML = `${msg} <span>${time}</span>`;
  log.prepend(line);
}

function trigger(url) {
  fetch(url, { method: "POST" }).catch(console.error);
}

function cooldown(button, label) {
  button.disabled = true;
  button.classList.add("cooldown");

  const ring = document.createElement("div");
  ring.className = "cooldown-ring";
  ring.style.animationDuration = cooldownSeconds + "s";
  button.appendChild(ring);

  let remaining = cooldownSeconds;
  button.textContent = `${label} (${remaining})`;

  const interval = setInterval(() => {
    remaining--;
    button.textContent = `${label} (${remaining})`;
    if (remaining <= 0) {
      clearInterval(interval);
      button.disabled = false;
      button.classList.remove("cooldown");
      button.textContent = label;
      ring.remove();
    }
  }, 1000);
}

wakeupBtn.onclick = () => {
  trigger(WAKEUP_URL);
  logMsg("🔔 Wake command sent");
  cooldown(wakeupBtn, "🔔 WAKE AARON UP");
};

pingBtn.onclick = () => {
  trigger(PING_URL);
  logMsg("☕ Ping sent");
  cooldown(pingBtn, "☕ PING AARON");
};

overrideBtn.onclick = () => {
  if (!confirm("⚠️ This will override silence mode.\nProceed?")) return;
  trigger(OVERRIDE_URL);
  logMsg("🚨 OVERRIDE ACTIVATED");
  cooldown(overrideBtn, "🚨 SILENCE / OVERRIDE");
};
</script>
</body>
</html>
